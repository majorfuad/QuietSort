name: Android build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Verify offline manifest
        run: |
          if grep -R 'android.permission.INTERNET' app/src/main; then
            echo 'INTERNET permission must not be requested' >&2
            exit 1
          fi
      - name: Build and unit tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon
